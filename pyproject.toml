[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "flattrace"
version = "0.1.0"
description = "Small local JSONL traces with cross-process parentage"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mario Hawat", email = "4396100+kyraneth@users.noreply.github.com" }]
keywords = ["tracing", "jsonl", "diagnostics", "offline", "profiling"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Debuggers",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/kyraneth/flattrace"
Repository = "https://github.com/kyraneth/flattrace"
Issues = "https://github.com/kyraneth/flattrace/issues"

[project.scripts]
flattrace = "flattrace.__main__:main"

[tool.maturin]
# The compiled reader engine lives inside the pure package; the pure
# modules (writer, check, export, stats) never import it. abi3-py310 is
# enabled on the pyo3 dependency in crates/flattrace-py/Cargo.toml, so
# maturin emits one abi3 wheel per platform plus no sdist.
module-name = "flattrace._flattrace_read"
bindings = "pyo3"
manifest-path = "crates/flattrace-py/Cargo.toml"
python-source = "."
strip = true
