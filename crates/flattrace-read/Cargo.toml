[package]
name = "flattrace-read"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "Offline reader engine for flattrace v1 JSONL: check, pair, quantiles, digest and query"
authors = ["Mario Hawat <4396100+kyraneth@users.noreply.github.com>"]
repository = "https://github.com/kyraneth/flattrace"
homepage = "https://github.com/kyraneth/flattrace"
readme = "../../README.md"
keywords = ["tracing", "jsonl", "diagnostics", "offline", "profiling"]
categories = ["development-tools::debugging", "development-tools::profiling"]

[workspace]

[[bin]]
name = "flattrace-read"
path = "src/main.rs"

[lib]
name = "flattrace_read"
path = "src/lib.rs"

[dependencies]
serde_json = "=1.0.150"
flate2 = "=1.1.10"
rusqlite = { version = "=0.41.0", features = ["bundled"] }
