[package]
name = "flattrace-napi"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "napi-rs bindings for the flattrace reader engine"
authors = ["Mario Hawat <4396100+kyraneth@users.noreply.github.com>"]
repository = "https://github.com/kyraneth/flattrace"

[workspace]

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
napi = { version = "=3.15.0" }
napi-derive = "=3.6.13"
flattrace-read = { path = "../flattrace-read" }
serde_json = "=1.0.150"
