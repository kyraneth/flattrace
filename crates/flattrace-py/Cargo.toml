[package]
name = "flattrace-py"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "PyO3 abi3 bindings for the flattrace reader engine"
authors = ["Mario Hawat <4396100+kyraneth@users.noreply.github.com>"]
repository = "https://github.com/kyraneth/flattrace"

[workspace]

[lib]
name = "_flattrace_read"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
pyo3 = { version = "=0.29.2", features = ["abi3-py310", "extension-module"] }
flattrace-read = { path = "../flattrace-read" }
serde_json = "=1.0.150"
