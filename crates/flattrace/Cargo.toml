[package]
name = "flattrace"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "Small local JSONL traces with cross-process parentage (Linux writer)"
authors = ["Mario Hawat <4396100+kyraneth@users.noreply.github.com>"]
repository = "https://github.com/kyraneth/flattrace"
homepage = "https://github.com/kyraneth/flattrace"
readme = "../../README.md"
keywords = ["tracing", "jsonl", "diagnostics", "offline", "profiling"]
categories = ["development-tools::debugging", "development-tools::profiling"]
include = ["src/lib.rs", "Cargo.toml", "Cargo.lock", "LICENSE"]

[dependencies]
serde_json = "=1.0.150"
regex = "=1.12.4"
